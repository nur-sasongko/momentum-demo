<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Momentum</title>
    <meta
      name="theme-color"
      content="#faf7f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#131417"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Keep in sync with THEME_INIT_SCRIPT in src/hooks/use-theme.ts -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme') || 'dark'
          var r = document.documentElement
          r.classList.remove('light', 'dark', 'auto')
          var isDark
          if (t === 'auto') {
            r.classList.add('auto')
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            if (isDark) r.classList.add('dark')
          } else if (t === 'dark') {
            r.classList.add('dark')
            isDark = true
          } else {
            r.classList.add('light')
            isDark = false
          }
          var color = isDark ? '#131417' : '#faf7f3'
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++)
            metas[i].setAttribute('content', color)
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-primary/30">
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
